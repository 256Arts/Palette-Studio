# Read by the shared `screenshots` runner in Repos/Scripts. Everything not set here takes that
# script's defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Palette Studio.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.palette3d"
MAC_APP_NAME="Palette Studio"
PLATFORMS="iphone duo ipad mac vision"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  library       = The Palettes library, the seeded palettes each showing their colors
  editor-sphere = The Sunset Study palette open in the editor, its colors placed on the 3D color solid
  editor-grid   = The Zughy 32 palette in the editor's Grid display mode, colors laid out as swatches
  pairs         = The Pairs tab: two colors and their gradient through every CSS interpolation space
  color         = The Color tab, one scratch color broken down into its components and conversions
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="palettestudio"

# The headline each shot is sold under on the website, written from the sentence in
# SHOT_DESCRIPTIONS that says what it shows. Keyed the same way, so a line follows its shot
# when the listing reorders.
SHOT_PROMOS="
  library       = Every palette you've made, a glance away.
  editor-sphere = Every color placed on a solid you can spin.
  editor-grid   = Flatten it into swatches to compare side by side.
  pairs         = Blend two colors through every CSS color space.
  color         = One color, in every format you'll paste it into.
"
